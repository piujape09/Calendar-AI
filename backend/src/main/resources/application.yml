server:
  port: ${PORT:8080}
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/calendarai}}
    username: ${SPRING_DATASOURCE_USERNAME:${DATABASE_USERNAME:calendarai}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DATABASE_PASSWORD:calendarai}}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
app:
  openai:
    apiKey: ${OPENAI_API_KEY:}
