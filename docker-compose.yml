version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: calendarai
      POSTGRES_PASSWORD: calendarai
      POSTGRES_DB: calendarai
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - 5432:5432

  backend:
    build:
      context: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/calendarai
      SPRING_DATASOURCE_USERNAME: calendarai
      SPRING_DATASOURCE_PASSWORD: calendarai
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    depends_on:
      - db
    ports:
      - 8080:8080

volumes:
  db_data:
